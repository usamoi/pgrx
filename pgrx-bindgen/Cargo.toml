[package]
name = "pgrx-bindgen"
description = "additional bindgen support for pgrx"
version = "0.14.1"
edition = "2021"
license = "MIT"
homepage = "https://github.com/pgcentralfoundation/pgrx"
repository = "https://github.com/pgcentralfoundation/pgrx"
documentation = "https://docs.rs/pgrx-bindgen"
include = ["src/**", "assets/**"]

[[bin]]
name = "pgrx-bindgen"
path = "./src/bin/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:target-triple"]

[dependencies]
pgrx-pg-config.workspace = true

eyre.workspace = true
proc-macro2.workspace = true
regex.workspace = true
syn.workspace = true
walkdir.workspace = true

bindgen = { version = "0.71.1", default-features = false, features = [
    "runtime",
] }
clang-sys = { version = "1", features = ["clang_6_0", "runtime"] }
prettyplease = "0.2.32"
quote = "1.0.40"
shlex = "1.3" # shell lexing, also used by many of our deps
tempfile = "3.19.1"
cc = "1.2"
clap = { version = "4.5.37", features = ["derive", "env"], optional = true }
zip = { version = "2.6.1" }
target-triple = { version = "0.1.4", optional = true }
